const A={
go(t){tab=t;render()},rep(v){rep=v;render()},
pay(id){const p=D().pays.find(x=>x.id==id);F_('تسجيل دفعة — '+H(p.name),[['amt','المبلغ (المتبقي '+N(p.rem)+')','number',p.rem],['date','تاريخ الدفع','date',today()],['payee','المستفيد/المورد','text',p.payee],['ref','رقم الفاتورة/السند','text',''],['notes','ملاحظات','ta','']],v=>{if(v.amt<=0||v.amt>p.rem){toast('المبلغ يجب أن يكون بين 1 والمتبقي');return false}M('pay','تسجيل دفعة '+N(v.amt)+' على '+id,()=>{S.recs.push({id:nid(S.recs),pid:id,amt:v.amt,date:v.date,payee:v.payee,ref:v.ref,notes:v.notes});const q=S.pays.find(x=>x.id==id);if(v.payee)q.payee=v.payee;if(v.ref)q.ref=v.ref})})},
